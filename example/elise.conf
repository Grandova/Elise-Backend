# Elise 配置模板；完整参数说明请参考 README.md。
type=xboard
panel_url=
panel_key=
node_id=1

check_interval=60
submit_interval=60

# 示例仅监听本机。确认协议与安全模式后再设置公开监听地址。
listen=127.0.0.1
multi_node_listen_strategy=auto

# 此开关目前生成共享自签证书；不是 ACME 或 Reality。
# 默认值为 true；本地明文协议测试时可设 false。
auto_tls=true
fake_sni=localhost

proxy_protocol=off
force_proxy_protocol=false

routes_file=/etc/elise/routes.toml
block_list_file=/etc/elise/blockList
white_list_file=/etc/elise/whiteList

dns_strategy=prefer_ipv4
auto_out_ip=false
out_ip_ipv4=
out_ip_ipv6=

device_limit_window=300
device_limit_prefix_ipv4=32
device_limit_prefix_ipv6=64

domain_sniff=true
sniff_redirect=false
forbidden_bit_torrent=true
forbidden_ports=
ban_private_ip=false

submit_traffic_min_traffic=0
submit_alive_ip_min_traffic=0

# systemd 用 journal；OpenRC 由服务文件将输出写入 /var/log/elise。
log_level=info
log_file=
audit_log_file=
