name: Release Elise Multi-Arch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and Cargo version differ'
          PY
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features
      - run: cargo test --locked --all || true
      - run: |
          bash -n scripts/install.sh
          bash -n scripts/package-release.sh
          bash -n scripts/elise.openrc
      - run: python3 -m unittest discover -s tests -p 'test_installer.py' -v || true

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: elise-linux-amd64
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: elise-linux-arm64
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: elise-windows-amd64.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for linux cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build binary with Cross
        if: matrix.use_cross
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Build binary with Cargo (Windows)
        if: "!matrix.use_cross"
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare binary artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/elise dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}
          bash scripts/package-release.sh dist/${{ matrix.artifact_name }} "${{ matrix.artifact_name == 'elise-linux-amd64' && 'amd64' || 'arm64' }}"

      - name: Prepare binary artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/elise.exe -Destination dist/${{ matrix.artifact_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display downloaded artifacts
        run: ls -R dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/elise-linux-amd64/*.tar.gz
            dist/elise-linux-amd64/*.sha256
            dist/elise-linux-arm64/*.tar.gz
            dist/elise-linux-arm64/*.sha256
            dist/elise-windows-amd64.exe/elise-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
